<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: WITHOUT IT env(safe-area-inset-*) IS ZERO.
         Eleven call sites across five lanes were already asking for the
         insets — the bottom bar, the sheets, the celebration, the
         Messages world — and every one of them had always resolved to
         0px. Correct code, no effect, for as long as it has existed.
         This is the attribute that turns the viewport from the safe box
         into the whole glass, and it is why the app has black bands
         above and below on a real device. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Saathban — Timeless Togetherness | Combating Elderly Loneliness</title>
    <meta name="description" content="Saathban is a vibrant ecosystem where generations flourish together. We cultivate a space where wisdom is inherited, life is shared, and every age thrives as one unified, timeless community." />
    <meta name="keywords" content="old age homes, senior living, senior citizens, senior community housing, senior living communities, aged care, social security, community, socialise, lonely, loneliness, well-being, elderly health, mental health, Saathban, timeless togetherness" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="/logo-small.png" />

    <!-- PWA: the app at /app is installable (manifest start_url/scope
         are /app, so installing from any page opens the app) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- EXACTLY SURFACE.nav (src/shared/tokens.js). The status bar and
         the app header are the same object to anyone holding the phone,
         so a value that merely looks close reads as a seam across the
         top of the screen. This was #063214 — the MARKETING green, two
         accents ago, older than either app palette since. -->
    <meta name="theme-color" content="#0F1113" />
    <!-- iOS add-to-home-screen -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent, and this is the top band.

         With "default" iOS standalone does NOT put the web view under
         the status bar: the system reserves that strip and paints it
         itself, which under a dark app is the black band. And because
         nothing is behind the status bar, env(safe-area-inset-top) is 0
         even with viewport-fit=cover — so the cover attribute alone
         could never have fixed it, and the top inset the header pads
         with was measuring a gap the page did not own.

         "black-translucent" hands the whole screen to the page. The
         status bar glyphs draw over our own pixels — white on the jet
         header, which is what we want — and the top inset becomes real
         so the header's padding starts doing its job. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Saathban" />

    <!-- Open Graph -->
    <meta property="og:title" content="Saathban — Timeless Togetherness" />
    <meta property="og:description" content="Combating elderly loneliness through community, compassion, and research." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saathban.com" />

    <!-- Both halves use Google Fonts; opening the connection before any
         script has run saves a round trip on a slow phone. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      body { margin: 0; padding: 0; }
    </style>

    <script>
    /* ── ONE DOCUMENT, TWO SITES, TWO RULES ──

       This file is served for every path: the marketing site at / and
       the app at /app. They must not be treated alike.

       THE APP IS NEVER TRACKED. Icons log their mood, their medicines,
       their blood pressure and their pain under /app, and the privacy
       promise is that what they write is theirs. A third-party
       advertising pixel firing PageView on those screens contradicts it
       outright, whatever it does or does not collect. So the Meta Pixel
       is injected only when this page is NOT under /app — and there is
       deliberately no <noscript> image beacon either, because that one
       cannot look at the path and would fire on /app for anybody without
       scripts.

       THE APP'S FONTS START HERE. They used to arrive as an @import
       inside a React <style>, which the browser cannot discover until
       the whole bundle has downloaded and run. Asking for the stylesheet
       from the document lets it race the script instead. AppRoot still
       asks as well (a harmless duplicate, served from cache) so a client-
       side arrival at /app from the marketing site keeps its fonts. */
    (function () {
      var isApp = /^\/app(\/|$)/.test(window.location.pathname);
      if (isApp) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap';
        document.head.appendChild(link);
        return;
      }
      /* Meta Pixel Code — marketing site only */
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1866208924335158');
      fbq('track', 'PageView');
      /* End Meta Pixel Code */
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
